<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>سواری ایڈمن</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Nastaliq Urdu',system-ui,sans-serif;background:#F2F6F3;color:#17231D;margin:0;padding:16px;line-height:2}
.card{background:#fff;border:1px solid #D9E3DC;border-radius:16px;padding:16px;max-width:560px;margin:0 auto 12px}
h1{font-size:1.2rem;margin:0 0 8px;color:#12352B}
input,textarea{width:100%;box-sizing:border-box;border:2px solid #D9E3DC;border-radius:12px;padding:10px;font:inherit;margin-bottom:10px;background:#fff;color:inherit}
button{width:100%;height:50px;border:0;border-radius:25px;background:#1F8A4C;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.alt{background:#12352B;margin-top:8px}
button.sm{width:auto;height:38px;padding:0 14px;font-size:.85rem}
button.red{background:#C2402F}
button:disabled{opacity:.5}
.row{border-bottom:1px solid #D9E3DC;padding:6px 0;font-size:.9rem}
.ad{display:flex;align-items:center;gap:10px;border-bottom:1px solid #D9E3DC;padding:8px 0}
.ad img{width:72px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
.ad div{flex:1;min-width:0;font-size:.9rem;line-height:1.6}
.ad.off{opacity:.5}
#prev{max-width:100%;max-height:160px;border-radius:10px;margin-bottom:10px}
#msg{text-align:center;color:#C2402F;min-height:1.6em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card" id="loginCard">
  <h1>ایڈمن لاگ اِن</h1>
  <input id="email" type="email" autocomplete="username" placeholder="ای میل">
  <input id="pass" type="password" autocomplete="current-password" placeholder="پاس ورڈ">
  <button id="loginBtn">داخل ہوں</button>
</div>

<div id="panel" hidden>
  <div class="card">
    <h1>نیا اشتہار</h1>
    <input id="adText" placeholder="اشتہار کا متن">
    <input id="adLink" placeholder="لنک (اختیاری) https://...">
    <input id="adImg" type="file" accept="image/*">
    <img id="prev" alt="" hidden>
    <button id="addBtn">اشتہار شامل کریں</button>
  </div>
  <div class="card">
    <h1>موجودہ اشتہارات</h1>
    <div id="adList"></div>
  </div>
  <div class="card">
    <h1>اشتہار کے لیے رابطہ نمبر</h1>
    <input id="waIn" inputmode="numeric" placeholder="واٹس ایپ نمبر (92 سے شروع)">
    <button id="saveBtn">محفوظ کریں</button>
  </div>
  <div class="card">
    <h1>اعداد و شمار</h1>
    <p id="stats"></p>
    <div id="list"></div>
    <button class="alt" id="refresh">تازہ کریں</button>
  </div>
  <div class="card"><button class="alt" id="logout">لاگ آؤٹ</button></div>
</div>
<p id="msg" role="status"></p>

<script>
const SB = 'https://tqmmtavqrdzucjgxdpyh.supabase.co';
const KEY = 'sb_publishable_0xMgiCrud66T7lGSQsZGJg_98Ii0wUZ';
const PUB = SB + '/storage/v1/object/public/ads/';
const $ = s => document.querySelector(s);
let tok = sessionStorage.getItem('tok') || '';
const say = m => { $('#msg').textContent = m || ''; };
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function call(path, method='GET', body, extra={}){
  const r = await fetch(SB+path, { method, headers:{ apikey:KEY, 'Content-Type':'application/json', ...(tok?{Authorization:'Bearer '+tok}:{}), ...extra }, body: body?JSON.stringify(body):undefined });
  const tx = await r.text(); let j=null; try{ j=tx?JSON.parse(tx):null }catch{}
  if(r.status===401){ logout(); throw new Error('session'); }
  if(!r.ok) throw new Error((j&&(j.error_description||j.message))||'error');
  return j;
}
function show(){ $('#loginCard').hidden=!!tok; $('#panel').hidden=!tok; }
function logout(){ tok=''; sessionStorage.removeItem('tok'); show(); say(''); }

async function shrink(file, maxW=800){
  const img = await createImageBitmap(file);
  const s = Math.min(1, maxW/img.width);
  const c = document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}
async function uploadImg(blob){
  const name = Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const r = await fetch(SB+'/storage/v1/object/ads/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok) throw new Error('upload');
  return PUB+name;
}

async function loadAds(){
  const a = await call('/rest/v1/ads?select=*&order=created_at.desc');
  $('#adList').innerHTML = a.length ? a.map(x=>`<div class="ad ${x.active?'':'off'}">
    ${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:''}
    <div>${esc(x.text)||'—'}${x.link?`<br><small>${esc(x.link)}</small>`:''}</div>
    <button class="sm alt" data-tg="${x.id}" data-on="${x.active}" style="margin:0">${x.active?'بند کریں':'چالو کریں'}</button>
    <button class="sm red" data-del="${x.id}" data-img="${esc(x.image_url||'')}" style="margin:0">حذف</button>
  </div>`).join('') : '<p>ابھی کوئی اشتہار نہیں</p>';
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{
    try{ await call('/rest/v1/ads?id=eq.'+b.dataset.tg,'PATCH',{active:b.dataset.on!=='true'}); loadAds(); }catch{ say('تبدیلی نہیں ہوئی'); }
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('یہ اشتہار حذف کریں؟')) return;
    try{
      await call('/rest/v1/ads?id=eq.'+b.dataset.del,'DELETE');
      const im=b.dataset.img; if(im.startsWith(PUB)) fetch(SB+'/storage/v1/object/ads/'+im.slice(PUB.length),{method:'DELETE',headers:{apikey:KEY,Authorization:'Bearer '+tok}}).catch(()=>{});
      loadAds();
    }catch{ say('حذف نہیں ہوا'); }
  });
}
async function load(){
  try{
    const s = await call('/rest/v1/settings?id=eq.1&select=wa');
    if(s[0]) $('#waIn').value = s[0].wa||'';
    await loadAds();
    const b = await call('/rest/v1/bookings?select=id,vehicle,from_name,to_name,fare,status,created_at&order=created_at.desc&limit=50');
    $('#stats').textContent = `کل بکنگز (آخری 50): ${b.length} · مکمل: ${b.filter(x=>x.status==='done').length}`;
    $('#list').innerHTML = b.slice(0,15).map(x=>`<div class="row">${esc(x.vehicle)} · Rs. ${x.fare} · ${esc(x.status)}<br>${esc(x.from_name)} → ${esc(x.to_name)}</div>`).join('');
  }catch(e){ if(e.message!=='session') say('ڈیٹا نہیں آ سکا'); }
}

$('#adImg').onchange = e=>{
  const f=e.target.files[0]; const p=$('#prev');
  if(f){ p.src=URL.createObjectURL(f); p.hidden=false; } else p.hidden=true;
};
$('#addBtn').onclick = async ()=>{
  say('');
  const text=$('#adText').value.trim(), link=$('#adLink').value.trim(), f=$('#adImg').files[0];
  if(!text && !f){ say('متن یا تصویر میں سے ایک ضرور دیں'); return; }
  if(link && !/^https:\/\//i.test(link)){ say('لنک https:// سے شروع ہونا چاہیے'); return; }
  $('#addBtn').disabled=true;
  try{
    let image_url=null;
    if(f){ say('تصویر اپلوڈ ہو رہی ہے…'); image_url = await uploadImg(await shrink(f)); }
    await call('/rest/v1/ads','POST',{text,link:link||null,image_url});
    $('#adText').value=''; $('#adLink').value=''; $('#adImg').value=''; $('#prev').hidden=true;
    say('اشتہار شامل ہو گیا'); loadAds();
  }catch(e){ if(e.message!=='session') say('اشتہار شامل نہیں ہوا (اجازت یا تصویر کا مسئلہ)'); }
  $('#addBtn').disabled=false;
};
$('#loginBtn').onclick = async ()=>{
  say('');
  try{
    const r = await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#pass').value})});
    const j = await r.json();
    if(!r.ok||!j.access_token){ say('ای میل یا پاس ورڈ غلط ہے'); return; }
    tok=j.access_token; sessionStorage.setItem('tok',tok); $('#pass').value=''; show(); load();
  }catch{ say('نیٹ ورک کا مسئلہ'); }
};
$('#saveBtn').onclick = async ()=>{
  const wa=$('#waIn').value.replace(/\D/g,'');
  if(!wa){ say('نمبر لکھیں'); return; }
  try{
    const r = await call('/rest/v1/settings?id=eq.1','PATCH',{wa},{Prefer:'return=representation'});
    say(r&&r.length ? 'محفوظ ہو گیا' : 'اجازت نہیں: یہ اکاؤنٹ ایڈمن نہیں ہے');
  }catch(e){ if(e.message!=='session') say('محفوظ نہیں ہوا'); }
};
$('#refresh').onclick = load;
$('#logout').onclick = logout;
show(); if(tok) load();
</script>
</body>
</html>
